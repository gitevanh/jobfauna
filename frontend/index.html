<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0c0d10;
    --bg-soft:   #131419;
    --panel:     #16181f;
    --panel-2:   #1c1f28;
    --line:      #272b36;
    --line-soft: #1f222b;
    --text:      #e8e9ed;
    --muted:     #8b909c;
    --faint:     #5b606c;
    --accent:    #6fdc8c;   /* fauna green (default theme) */
    --accent-dim:#15331f;
    --accent-ink:#06210f;
    --glow:      rgba(111,220,140,.08);
    --good:      #4ade80;
    --good-dim:  #16321f;
    --warn:      #fbbf24;
    --bad:       #f87171;
    --info:      #60a5fa;

    --col-saved:     #8b909c;
    --col-applied:   #60a5fa;
    --col-interview: #f5a623;
    --col-offer:     #4ade80;
    --col-rejected:  #f87171;

    --display: 'Bricolage Grotesque', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --radius: 12px;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--body);
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% -10%, var(--glow), transparent 40%),
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: auto, 44px 44px, 44px 44px;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(12,13,16,.7);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.02em;
  }
  .brand .dot { color: var(--accent); }
  .brand .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    border: 1px solid var(--line);
    padding: 2px 7px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .stats { display: flex; gap: 22px; margin-left: 8px; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat .n { font-family: var(--mono); font-weight: 700; font-size: 17px; }
  .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; margin-top: 2px; }

  .spacer { flex: 1; }

  .search {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 12px;
    color: var(--text);
    font-family: var(--body);
    font-size: 13px;
    width: 200px;
    transition: border-color .15s, width .2s;
  }
  .search:focus { outline: none; border-color: var(--accent); width: 240px; }
  .search::placeholder { color: var(--faint); }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.on { border-color: var(--good-dim); color: var(--good); }
  .pill.on .led { background: var(--good); box-shadow: 0 0 8px var(--good); }

  .btn {
    font-family: var(--body);
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 9px;
    padding: 9px 16px;
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--faint); }
  .btn-danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  .btn-danger:hover { border-color: var(--bad); }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(220px, 1fr));
    gap: 16px;
    padding: 24px 28px 60px;
    align-items: start;
  }
  .column {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 200px;
    opacity: 0;
    animation: rise .5s ease forwards;
  }
  .column:nth-child(1){ animation-delay:.02s } .column:nth-child(2){ animation-delay:.08s }
  .column:nth-child(3){ animation-delay:.14s } .column:nth-child(4){ animation-delay:.20s }
  .column:nth-child(5){ animation-delay:.26s }
  @keyframes rise { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

  .col-head {
    display: flex; align-items: center; gap: 9px;
    padding: 14px 14px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .col-head .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .col-head .name {
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
  }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--faint); background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 2px 8px;
  }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 80px; flex: 1; }
  .col-body.drag-over { background: rgba(245,166,35,.04); border-radius: 0 0 var(--radius) var(--radius); }

  .empty-col { color: var(--faint); font-size: 12px; text-align: center; padding: 20px 8px; font-style: italic; }

  /* ---------- Card ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px;
    cursor: pointer;
    transition: transform .1s, border-color .15s, box-shadow .15s;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--faint); box-shadow: var(--shadow); }
  .card.dragging { opacity: .4; }
  .card .company { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .03em; margin-bottom: 4px; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.3; margin-bottom: 10px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    font-family: var(--mono); font-size: 10px;
    padding: 3px 7px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .chip.cat { text-transform: uppercase; letter-spacing: .05em; }
  .fit {
    margin-left: auto;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
  }
  .fit.high { color: var(--good); background: var(--good-dim); }
  .fit.mid  { color: var(--warn); background: #322a10; }
  .fit.low  { color: var(--faint); background: var(--panel-2); }
  .card .loc { font-size: 11px; color: var(--faint); margin-top: 8px; }

  /* ---------- Drawer ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
    backdrop-filter: blur(2px);
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 92vw);
    background: var(--bg-soft); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
    z-index: 101; display: flex; flex-direction: column;
  }
  .drawer.show { transform: none; }
  .drawer-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { font-family: var(--display); font-size: 18px; font-weight: 700; }
  .icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px;
  }
  .icon-btn:hover { color: var(--text); background: var(--panel); }
  .drawer-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .field input, .field textarea, .field select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: var(--body); font-size: 13px;
    transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field .desc { min-height: 120px; font-size: 12px; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ai-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .ai-box .ai-head { display: flex; align-items: center; gap: 8px; }
  .ai-box .ai-head .label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .ai-box .summary { font-size: 13px; line-height: 1.5; color: var(--text); }
  .ai-box .summary.empty { color: var(--faint); font-style: italic; }
  .linkout { font-family: var(--mono); font-size: 12px; color: var(--info); text-decoration: none; word-break: break-all; }
  .linkout:hover { text-decoration: underline; }
  .drawer-foot { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .drawer-foot .btn { flex: 1; }

  /* ---------- Modal (account / admin) ---------- */
  .modal-scrim { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); display:none; place-items:center; z-index:120; }
  .modal-scrim.show { display:grid; }
  .modal { width:min(580px,94vw); max-height:86vh; background:var(--bg-soft); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; box-shadow:var(--shadow); overflow:hidden; }
  .modal-head { display:flex; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-head h2 { font-family:var(--display); font-size:19px; font-weight:700; }
  .modal-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
  .modal-body input, .modal-body select, .modal-body textarea { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--text); font-family:var(--body); font-size:13px; width:100%; }
  .modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus { outline:none; border-color:var(--accent); }
  .modal-body textarea { resize:vertical; min-height:70px; line-height:1.5; }
  .section-label { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px; }
  .urow { display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-top:6px; }
  .urow .who { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .urow .who .em { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .urow .who .sub { font-family:var(--mono); font-size:10px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .urow .acts { margin-left:auto; display:flex; gap:6px; flex-shrink:0; }
  .mini { font-family:var(--body); font-size:11px; font-weight:600; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; white-space:nowrap; }
  .mini:hover { border-color:var(--faint); }
  .mini.good { color:var(--good); border-color:var(--good-dim); }
  .mini.bad { color:var(--bad); }
  .badge { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); }
  .badge.admin { color:var(--accent); border-color:var(--accent-dim); }
  .badge.pending { color:var(--warn); border-color:#322a10; }
  .badge.disabled { color:var(--bad); }
  .token-box { font-family:var(--mono); font-size:12px; background:var(--panel-2); border:1px solid var(--accent-dim); border-radius:8px; padding:10px; color:var(--accent); word-break:break-all; margin-top:6px; }
  .empty-note { color:var(--faint); font-size:12px; }

  /* ---------- Empty / toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1000px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .stats { display: none; }
  }

  /* ---------- Themes (named after the NimiBeats set; Fauna is the default in :root) ---------- */
  html[data-theme="nimi"]{--accent:#a3d9c0;--accent-dim:#1e302a;--accent-ink:#08231b;--glow:rgba(163,217,192,.08);}
  html[data-theme="mint"]{--accent:#b9f0d6;--accent-dim:#1d332c;--accent-ink:#07231a;--glow:rgba(185,240,214,.07);}
  html[data-theme="doki"]{--accent:#f5d042;--accent-dim:#332b10;--accent-ink:#221c04;--glow:rgba(245,208,66,.08);}
  html[data-theme="sakuna"]{--accent:#f9a8d4;--accent-dim:#3a2230;--accent-ink:#2a0f1e;--glow:rgba(249,168,212,.09);}
  html[data-theme="kronii"]{--accent:#6cb8f2;--accent-dim:#122a3d;--accent-ink:#061a2a;--glow:rgba(108,184,242,.09);}
  html[data-theme="gigi"]{--accent:#f5a623;--accent-dim:#3a2e16;--accent-ink:#1a1205;--glow:rgba(245,166,35,.08);}
  html[data-theme="shiori"]{--accent:#c084fc;--accent-dim:#2a1f3d;--accent-ink:#160a22;--glow:rgba(192,132,252,.10);}
  html[data-theme="mono"]{--accent:#e8e9ed;--accent-dim:#2a2d34;--accent-ink:#0c0d10;--glow:rgba(232,233,237,.05);}

  .brand .logo { font-size:20px; color:var(--accent); line-height:1; }
  .brand .logo img { height:24px; width:auto; display:block; border-radius:5px; }
  .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .theme-card { text-align:left; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; transition:border-color .15s; }
  .theme-card:hover { border-color:var(--faint); }
  .theme-card .dotc { width:12px; height:12px; border-radius:50%; display:block; margin-bottom:8px; }
  .theme-card .tname { font-weight:600; font-size:13px; }
  .theme-card .tsub { font-size:10px; color:var(--muted); margin-top:2px; }
  .theme-card.active { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .about-name { font-family:var(--display); font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .about-name .logo { font-size:22px; }
  .about p { font-size:13px; line-height:1.6; color:var(--muted); margin-top:8px; }
  .about a { color:var(--accent); text-decoration:none; }
  .about a:hover { text-decoration:underline; }
</style>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('jobfauna-theme')||'fauna';}catch(e){}})();</script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" id="brand-logo">🌿</span>
      <h1 id="brand-name">JobFauna</h1>
    </div>
    <div class="stats">
      <div class="stat"><span class="n" id="stat-total">0</span><span class="l">total</span></div>
      <div class="stat"><span class="n" id="stat-active">0</span><span class="l">active</span></div>
      <div class="stat"><span class="n" id="stat-interview">0</span><span class="l">interviews</span></div>
    </div>
    <div class="spacer"></div>
    <input class="search" id="search" placeholder="Search company or role..." />
    <span class="pill" id="ai-pill"><span class="led"></span><span id="ai-pill-text">AI off</span></span>
    <button class="btn btn-primary" id="add-btn">+ Add job</button>
    <button class="btn btn-ghost" id="admin-btn" style="display:none">⚙ Admin</button>
    <button class="btn btn-ghost" id="account-btn" title="Account">account</button>
  </header>

  <main class="board" id="board"></main>

  <!-- Drawer (edit/create) -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="drawer-title">Edit job</h2>
      <div class="spacer"></div>
      <button class="icon-btn" id="close-drawer">&times;</button>
    </div>
    <div class="drawer-body">
      <div class="field">
        <label>Role title</label>
        <input id="f-title" placeholder="e.g. Systems Administrator" />
      </div>
      <div class="row2">
        <div class="field"><label>Company</label><input id="f-company" /></div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="saved">Saved</option>
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Location</label><input id="f-location" /></div>
        <div class="field"><label>Salary</label><input id="f-salary" /></div>
      </div>
      <div class="field">
        <label>Job URL</label>
        <input id="f-url" placeholder="https://..." />
        <a class="linkout" id="f-url-link" target="_blank" style="display:none"></a>
      </div>

      <div class="ai-box">
        <div class="ai-head">
          <span class="label">◈ AI insight</span>
          <div class="spacer"></div>
          <span class="fit low" id="f-fit">—</span>
          <span class="chip cat" id="f-cat" style="display:none"></span>
        </div>
        <div class="summary empty" id="f-summary">No AI summary yet.</div>
        <button class="btn btn-ghost" id="reenrich-btn" style="display:none; align-self:flex-start;">↻ Run AI analysis</button>
      </div>

      <div class="field">
        <label>Your notes</label>
        <textarea id="f-notes" placeholder="Recruiter name, follow-up date, why you want it..."></textarea>
      </div>
      <div class="field">
        <label>Job description</label>
        <textarea id="f-description" class="desc"></textarea>
      </div>

      <div class="field" id="cover-section">
        <div style="display:flex;align-items:center;gap:8px">
          <label style="margin:0">Cover letter</label>
          <div class="spacer"></div>
          <button class="mini" id="gen-cover" style="display:none">✦ Generate</button>
          <button class="mini" id="copy-cover">Copy</button>
          <button class="mini" id="docx-cover">.docx</button>
          <button class="mini" id="pdf-cover">.pdf</button>
        </div>
        <textarea id="f-cover" class="desc" placeholder="Generate a tailored letter, or write your own..."></textarea>
      </div>

      <div class="field" id="cv-section">
        <div style="display:flex;align-items:center;gap:8px">
          <label style="margin:0">Tailored CV</label>
          <div class="spacer"></div>
          <button class="mini" id="gen-cv" style="display:none">✦ Tailor my CV</button>
          <button class="mini" id="copy-cv">Copy</button>
          <button class="mini" id="docx-cv">.docx</button>
          <button class="mini" id="pdf-cv">.pdf</button>
        </div>
        <textarea id="f-tailored" class="desc" placeholder="Tailor your saved CV to this role..."></textarea>
      </div>
    </div>
    <div class="drawer-foot">
      <button class="btn btn-danger" id="delete-btn">Delete</button>
      <button class="btn btn-primary" id="save-btn">Save</button>
    </div>
  </aside>

  <div class="modal-scrim" id="modal-scrim"><div class="modal" id="modal"></div></div>

  <div class="toast" id="toast"></div>

<script>
const API = "/api";
const COLUMNS = [
  { key: "saved",     label: "Saved",     color: "var(--col-saved)" },
  { key: "applied",   label: "Applied",   color: "var(--col-applied)" },
  { key: "interview", label: "Interview", color: "var(--col-interview)" },

function applyBrand(me) {

let jobs = [];
let aiEnabled = false;
let editingId = null;   // null = creating a new job
let searchTerm = "";
let currentUser = null;

// ---------- API helpers ----------
async function api(path, opts) {
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 401) { window.location = "/login"; throw new Error("unauthorized"); }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.status === 204 ? null : res.json();
}

async function loadMe() {
  let me;
  try { me = await api("/me"); } catch (e) { return; }
  if (me.needs_setup || !me.authenticated) { window.location = "/login"; return; }
  applyBrand(me);
  currentUser = me.user;
  document.getElementById("account-btn").textContent = currentUser.email;
  if (currentUser.role === "admin") document.getElementById("admin-btn").style.display = "inline-block";
  aiEnabled = me.enrichment_enabled;
  const pill = document.getElementById("ai-pill");
  pill.classList.toggle("on", aiEnabled);
  document.getElementById("ai-pill-text").textContent = aiEnabled ? "AI on" : "AI off";
}

async function loadJobs() {
  jobs = await api("/jobs");
  render();
}

// ---------- Rendering ----------
function fitClass(score) { return score >= 70 ? "high" : score >= 40 ? "mid" : "low"; }

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const term = searchTerm.toLowerCase();
  const visible = jobs.filter(j =>
    !term || (j.company + " " + j.title).toLowerCase().includes(term)
  );

  COLUMNS.forEach(col => {
    const inCol = visible.filter(j => j.status === col.key);
    const colEl = document.createElement("section");
    colEl.className = "column";
    colEl.innerHTML = `
      <div class="col-head">
        <span class="swatch" style="background:${col.color}"></span>
        <span class="name">${col.label}</span>
        <span class="count">${inCol.length}</span>
      </div>
      <div class="col-body" data-status="${col.key}"></div>`;
    const body = colEl.querySelector(".col-body");

    if (inCol.length === 0) {
      body.innerHTML = `<div class="empty-col">Drop here</div>`;
    } else {
      inCol.forEach(j => body.appendChild(cardEl(j)));
    }

    // drag-and-drop targets
    body.addEventListener("dragover", e => { e.preventDefault(); body.classList.add("drag-over"); });
    body.addEventListener("dragleave", () => body.classList.remove("drag-over"));
    body.addEventListener("drop", e => {
      e.preventDefault();
      body.classList.remove("drag-over");
      const id = Number(e.dataTransfer.getData("text/plain"));
      moveJob(id, col.key);
    });

    board.appendChild(colEl);
  });

  // stats
  const active = jobs.filter(j => ["saved","applied","interview"].includes(j.status)).length;
  document.getElementById("stat-total").textContent = jobs.length;
  document.getElementById("stat-active").textContent = active;
  document.getElementById("stat-interview").textContent = jobs.filter(j => j.status === "interview").length;
}

function cardEl(j) {
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  const fit = j.fit_score > 0
    ? `<span class="fit ${fitClass(j.fit_score)}">${j.fit_score}</span>` : "";
  const cat = j.category ? `<span class="chip cat">${j.category}</span>` : "";
  const loc = j.location ? `<div class="loc">⚲ ${escapeHtml(j.location)}</div>` : "";
  el.innerHTML = `
    <div class="company">${escapeHtml(j.company || "—")}</div>
    <div class="title">${escapeHtml(j.title || "Untitled role")}</div>
    <div class="meta">${cat}${fit}</div>
    ${loc}`;
  el.addEventListener("click", () => openDrawer(j));
  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", j.id);
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  return el;
}

async function moveJob(id, status) {
  const job = jobs.find(j => j.id === id);
  if (!job || job.status === status) return;
  job.status = status;                 // optimistic update
  render();
  try { await api(`/jobs/${id}`, { method: "PATCH", body: JSON.stringify({ status }) }); }
  catch (e) { toast("Couldn't save — is the server running?"); loadJobs(); }
}

// ---------- Drawer ----------
function openDrawer(job) {
  editingId = job ? job.id : null;
  document.getElementById("drawer-title").textContent = job ? "Edit job" : "Add job";
  const g = id => document.getElementById(id);
  g("f-title").value = job?.title || "";
  g("f-company").value = job?.company || "";
  g("f-status").value = job?.status || "saved";
  g("f-location").value = job?.location || "";
  g("f-salary").value = job?.salary || "";
  g("f-url").value = job?.url || "";
  g("f-notes").value = job?.notes || "";
  g("f-description").value = job?.description || "";

  // url link
  const link = g("f-url-link");
  if (job?.url) { link.style.display = "inline"; link.href = job.url; link.textContent = "↗ open posting"; }
  else link.style.display = "none";

  // ai box
  const fitEl = g("f-fit");
  const score = job?.fit_score || 0;
  fitEl.textContent = score > 0 ? score : "—";
  fitEl.className = "fit " + (score > 0 ? fitClass(score) : "low");
  const catEl = g("f-cat");
  if (job?.category) { catEl.style.display = "inline"; catEl.textContent = job.category; }
  else catEl.style.display = "none";
  const sum = g("f-summary");
  if (job?.summary) { sum.textContent = job.summary; sum.classList.remove("empty"); }
  else { sum.textContent = aiEnabled ? "No AI summary yet." : "Add an API key to enable AI analysis."; sum.classList.add("empty"); }

  // re-enrich only for existing jobs when AI is on
  g("reenrich-btn").style.display = (job && aiEnabled) ? "inline-block" : "none";
  g("delete-btn").style.display = job ? "block" : "none";

  // cover letter + tailored CV
  g("f-cover").value = job?.cover_letter || "";
  g("f-tailored").value = job?.tailored_cv || "";
  const canGen = job && aiEnabled;
  g("gen-cover").style.display = canGen ? "inline-block" : "none";
  g("gen-cv").style.display = canGen ? "inline-block" : "none";
  if (canGen) {
    g("gen-cover").onclick = () => generateDoc("cover-letter", "gen-cover", "f-cover", "Cover letter");
    g("gen-cv").onclick = () => generateDoc("tailor-cv", "gen-cv", "f-tailored", "Tailored CV");
  }
  g("copy-cover").onclick = () => copyField("f-cover");
  g("copy-cv").onclick = () => copyField("f-tailored");
  g("docx-cover").onclick = () => downloadDoc("docx", "f-cover", "Cover letter");
  g("pdf-cover").onclick = () => downloadDoc("pdf", "f-cover", "Cover letter");
  g("docx-cv").onclick = () => downloadDoc("docx", "f-tailored", "Tailored CV");
  g("pdf-cv").onclick = () => downloadDoc("pdf", "f-tailored", "Tailored CV");

  document.getElementById("scrim").classList.add("show");
  document.getElementById("drawer").classList.add("show");
}

async function generateDoc(endpoint, btnId, fieldId, label) {
  if (editingId === null) return;
  const btn = document.getElementById(btnId);
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Writing…";
  try {
    const r = await api(`/jobs/${editingId}/${endpoint}`, { method: "POST" });
    const text = r.cover_letter ?? r.tailored_cv ?? "";
    document.getElementById(fieldId).value = text;
    // keep local copy in sync
    const idx = jobs.findIndex(j => j.id === editingId);
    if (idx >= 0) { jobs[idx][endpoint === "cover-letter" ? "cover_letter" : "tailored_cv"] = text; }
    toast(label + " ready");
  } catch (e) {
    toast(label + " failed — check your CV/AI key");
  }
  btn.disabled = false; btn.textContent = orig;
}

function copyField(id) {
  const v = document.getElementById(id).value;
  if (!v) { toast("Nothing to copy yet"); return; }
  navigator.clipboard.writeText(v).then(() => toast("Copied"), () => toast("Copy failed"));
}

async function downloadDoc(fmt, fieldId, label) {
  const text = document.getElementById(fieldId).value;
  if (!text.trim()) { toast("Nothing to download yet"); return; }
  const company = document.getElementById("f-company").value.trim();
  const title = document.getElementById("f-title").value.trim();
  const fname = `${label} - ${company || title || "JobFauna"}`;
  try {
    const res = await fetch(`/api/render/${fmt}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ body: text, filename: fname }),
    });
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${fname}.${fmt}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    toast("Download failed");
  }
}

function closeDrawer() {
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
  editingId = null;
}

function collectForm() {
  const g = id => document.getElementById(id).value.trim();
  return {
    title: g("f-title"), company: g("f-company"), status: g("f-status"),
    location: g("f-location"), salary: g("f-salary"), url: g("f-url"),
    notes: g("f-notes"), description: g("f-description"),
    cover_letter: g("f-cover"), tailored_cv: g("f-tailored"),
  };
}

async function saveJob() {
  const data = collectForm();
  try {
    if (editingId === null) {
      await api("/jobs", { method: "POST", body: JSON.stringify({ ...data, source: "manual" }) });
      toast("Job added" + (aiEnabled ? " — AI analysis applied" : ""));
    } else {
      await api(`/jobs/${editingId}`, { method: "PATCH", body: JSON.stringify(data) });
      toast("Saved");
    }
    closeDrawer();
    await loadJobs();
  } catch (e) { toast("Save failed — is the server running?"); }
}

async function deleteJob() {
  if (editingId === null) return;
  if (!confirm("Delete this job?")) return;
  await api(`/jobs/${editingId}`, { method: "DELETE" });
  closeDrawer();
  toast("Deleted");
  await loadJobs();
}

async function reenrich() {
  if (editingId === null) return;
  const btn = document.getElementById("reenrich-btn");
  btn.textContent = "Analyzing...";
  btn.disabled = true;
  try {
    const updated = await api(`/jobs/${editingId}/enrich`, { method: "POST" });
    const idx = jobs.findIndex(j => j.id === editingId);
    if (idx >= 0) jobs[idx] = updated;
    openDrawer(updated);   // refresh drawer contents
    render();
    toast("AI analysis updated");
  } catch (e) { toast("Analysis failed"); }
  btn.textContent = "↻ Run AI analysis";
  btn.disabled = false;
}

    }
  };

  document.getElementById("set-save").onclick = async () => {
    const m = document.getElementById("set-msg");
    m.style.textAlign = "left";
    const body = {
      instance_name: document.getElementById("set-name").value.trim(),
      instance_logo: document.getElementById("set-logo").value.trim(),
      login_tagline: document.getElementById("set-tagline").value.trim(),
      logo_url: document.getElementById("set-logourl").value.trim(),
      enrich_model: document.getElementById("set-enrich-model").value,
      writing_model: document.getElementById("set-writing-model").value,
    };
    const aik = document.getElementById("set-ai").value.trim();
    if (aik) body.anthropic_api_key = aik;
    try {
      await api("/admin/settings", { method: "PATCH", body: JSON.stringify(body) });
      m.className = "msg ok"; m.textContent = "Saved.";
      document.getElementById("set-ai").value = "";
      const me = await api("/me");
      applyBrand(me);
      aiEnabled = me.enrichment_enabled;
      document.getElementById("ai-pill").classList.toggle("on", aiEnabled);
      document.getElementById("ai-pill-text").textContent = aiEnabled ? "AI on" : "AI off";
      await loadAdminSettings();
    } catch (e) {
      m.className = "msg err"; m.textContent = "Couldn't save settings.";
    }
  };
}

function fillModelSelect(el, models, current, def) {
  el.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = ""; opt0.textContent = `Default (${def})`;
  el.appendChild(opt0);
  const list = models.slice();
  if (current && !list.includes(current)) list.unshift(current);
  list.forEach(id => {
    const o = document.createElement("option");
    o.value = id; o.textContent = id;
    el.appendChild(o);
  });
  el.value = current || "";
}

async function loadAdminSettings() {
  const s = await api("/admin/settings");
  document.getElementById("set-name").value = s.instance_name;
  document.getElementById("set-logo").value = s.instance_logo;
  document.getElementById("set-tagline").value = s.instance_tagline || "";
  document.getElementById("set-logourl").value = s.logo_url || "";

  let models = [];
  try { models = (await api("/admin/models")).models || []; } catch (e) {}
  fillModelSelect(document.getElementById("set-enrich-model"), models, s.enrich_model, s.default_enrich_model);
  fillModelSelect(document.getElementById("set-writing-model"), models, s.writing_model, s.default_writing_model);
  document.getElementById("model-note").textContent = models.length
    ? "Left: enrichment (cheap). Right: cover letters / CV (stronger)."
    : "Set an API key to load the full model list (current selections shown).";

  const note = document.getElementById("set-ai-note");
  if (s.ai_key_from_env) {
    note.innerHTML = "Using <code>ANTHROPIC_API_KEY</code> from the environment (it overrides any key set here).";
  } else if (s.ai_key_set) {
    note.innerHTML = `A key is saved — AI is on. Enter a new key to replace it, or <a href="#" id="clear-ai" style="color:var(--bad)">clear it</a>.`;
    const clear = document.getElementById("clear-ai");
    if (clear) clear.onclick = async (e) => {
      e.preventDefault();
      await api("/admin/settings", { method: "PATCH", body: JSON.stringify({ anthropic_api_key: "" }) });
      const me = await api("/me");
      aiEnabled = me.enrichment_enabled;
      document.getElementById("ai-pill").classList.toggle("on", aiEnabled);
      document.getElementById("ai-pill-text").textContent = aiEnabled ? "AI on" : "AI off";
      await loadAdminSettings();
    };
  } else {
    note.textContent = "No key set — AI features are off.";
  }
}

async function refreshAdmin() {
  const users = await api("/admin/users");
  const pending = users.filter(u => u.status === "pending");
  const active = users.filter(u => u.status !== "pending");
  document.getElementById("pl-label").textContent = `Access requests (${pending.length})`;

  const pl = document.getElementById("pending-list");
  pl.innerHTML = pending.length ? "" : `<div class="empty-note">No pending requests.</div>`;
  pending.forEach(u => {
    const row = document.createElement("div");
    row.className = "urow";
    const note = u.note ? " · " + escapeHtml(u.note) : "";
    row.innerHTML = `<div class="who"><span class="em">${escapeHtml(u.email)}</span><span class="sub">${escapeHtml(u.name || "")}${note}</span></div><div class="acts"><button class="mini good">Approve</button><button class="mini bad">Reject</button></div>`;
    const [appr, rej] = row.querySelectorAll("button");
    appr.onclick = async () => { await api("/admin/users/" + u.id, { method: "PATCH", body: JSON.stringify({ status: "approved" }) }); refreshAdmin(); };
    rej.onclick = async () => { if (confirm("Reject and delete this request?")) { await api("/admin/users/" + u.id, { method: "DELETE" }); refreshAdmin(); } };
    pl.appendChild(row);
  });

  const ul = document.getElementById("user-list");
  ul.innerHTML = "";
  active.forEach(u => {
    const row = document.createElement("div");
    row.className = "urow";
    const isMe = u.id === currentUser.id;
    const badges = `<span class="badge ${u.role}">${u.role}</span>` + (u.status !== "approved" ? `<span class="badge ${u.status}">${u.status}</span>` : "");
    row.innerHTML = `<div class="who"><span class="em">${escapeHtml(u.email)}${isMe ? ' (you)' : ''}</span><span class="sub">${badges}</span></div><div class="acts"></div>`;
    const acts = row.querySelector(".acts");

    const roleBtn = document.createElement("button");
    roleBtn.className = "mini";
    roleBtn.textContent = u.role === "admin" ? "Remove admin" : "Make admin";
    roleBtn.onclick = async () => {
      try { await api("/admin/users/" + u.id, { method: "PATCH", body: JSON.stringify({ role: u.role === "admin" ? "user" : "admin" }) }); }
      catch (e) { toast("Can't remove the last admin"); }
      refreshAdmin();
    };

    const stBtn = document.createElement("button");
    stBtn.className = "mini";
    stBtn.textContent = u.status === "approved" ? "Disable" : "Enable";
    stBtn.onclick = async () => {
      try { await api("/admin/users/" + u.id, { method: "PATCH", body: JSON.stringify({ status: u.status === "approved" ? "disabled" : "approved" }) }); }
      catch (e) { toast("Can't disable the last admin"); }
      refreshAdmin();
    };

    const delBtn = document.createElement("button");
    delBtn.className = "mini bad";
    delBtn.textContent = "Delete";
    delBtn.onclick = async () => {
      if (!confirm("Delete " + u.email + " and all their jobs?")) return;
      try { await api("/admin/users/" + u.id, { method: "DELETE" }); }
      catch (e) { toast("Can't delete the last admin"); }
      refreshAdmin();
    };

    acts.append(roleBtn, stBtn, delBtn);
    ul.appendChild(row);
  });
}

// ---------- Misc ----------
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- Wire up ----------
document.getElementById("add-btn").addEventListener("click", () => openDrawer(null));
document.getElementById("close-drawer").addEventListener("click", closeDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("save-btn").addEventListener("click", saveJob);
document.getElementById("delete-btn").addEventListener("click", deleteJob);
document.getElementById("reenrich-btn").addEventListener("click", reenrich);
document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value; render(); });
document.getElementById("account-btn").addEventListener("click", openAccount);
document.getElementById("admin-btn").addEventListener("click", openAdmin);
document.getElementById("modal-scrim").addEventListener("click", e => { if (e.target.id === "modal-scrim") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closeModal(); } });

// ---------- Go ----------
(async () => { await loadMe(); await loadJobs(); })();
