<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/login.css" />
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('jobfauna-theme')||'fauna';}catch(e){}})();</script>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="logo" id="brand-logo">🌿</span><h1 id="brand-name">JobFauna</h1></div>
    <div class="sub" id="sub">Sign in to your board.</div>

    <div id="view-login">
      <label>Email</label><input id="li-email" type="email" autocomplete="username" />
      <label>Password</label><input id="li-pass" type="password" autocomplete="current-password" />
      <button class="primary" id="li-go">Sign in</button>
      <div class="alt">Don't have access? <a id="to-request">Request access</a></div>
    </div>

    <div id="view-request" class="hidden">
      <label>Name</label><input id="rq-name" />
      <label>Email</label><input id="rq-email" type="email" />
      <label>Password</label><input id="rq-pass" type="password" autocomplete="new-password" />
      <label>Note to admin (optional)</label><textarea id="rq-note" placeholder="Who are you / why you'd like access"></textarea>
      <button class="primary" id="rq-go">Request access</button>
      <div class="alt">Already have an account? <a id="to-login">Sign in</a></div>
    </div>

    <div id="view-setup" class="hidden">
      <label>Admin email</label><input id="su-email" type="email" />
      <label>Name</label><input id="su-name" />
      <label>Password (8+ chars)</label><input id="su-pass" type="password" autocomplete="new-password" />
      <button class="primary" id="su-go">Create admin account</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
<script src="/static/js/login.js"></script>
</body>
</html>
